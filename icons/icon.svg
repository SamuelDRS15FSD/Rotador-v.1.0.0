<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c23152"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Fondo circular -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Anillo decorativo -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Letras ER -->
  <text x="256" y="280" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="200" fill="#ffffff" letter-spacing="-8">ER</text>
  <!-- Línea decorativa inferior -->
  <rect x="140" y="330" width="232" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  <!-- Texto inferior -->
  <text x="256" y="370" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="400" font-size="36" fill="rgba(255,255,255,0.7)" letter-spacing="12">ROTADOR</text>
</svg>
